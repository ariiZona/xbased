# Builds the PC editions on the platforms this machine isn't: Linux
# (ubuntu-22.04, the AppImage's base) and Windows (MSYS2 CLANG64, the
# toolchain BUILDING.md names), each with upstream's host tests; and macOS
# for Intel, cross-built on GitHub's Apple silicon runner, where it can't
# run (the guest's memory at address 0, cmake/macos.cmake): its build and
# the executable's layout are checked. Nothing is uploaded. Not in a private
# copy of the repository, which builds what it needs with its own workflow.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build pkg-config python3 zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libgl-dev \
            libdecor-0-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev libibus-1.0-dev
      - name: Dependencies
        run: bash tools/fetch_deps.sh
      - name: Configure
        # LTO off here: ubuntu-22.04's clang 14 doesn't link ThinLTO (GNU ld
        # lacks its cache flag; through lld it loses the entry symbol). The
        # release builds keep LTO; this job checks that the sources compile
        # and link.
        run: cmake -S native -B ../build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DXBASED_LTO=OFF \
               -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build ../build/linux --target xbased
      - name: Host tests
        # upstream's own (tools/native/host-tests.sh). hle/test_psh fails
        # upstream since 1.2.3 (its bump-environment case still expects the
        # divide by q that 1.2.3 took out): any other failure fails the job.
        run: |
          bash tools/native/host-tests.sh ../build/linux | tee ../host-tests.txt || true
          ! grep '^FAIL' ../host-tests.txt | grep -v -x 'FAIL  hle/test_psh'

  windows:
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python
      - name: Dependencies
        run: bash tools/fetch_deps.sh
      - name: Configure
        run: cmake -S native -B ../build/win -G Ninja -DCMAKE_BUILD_TYPE=Release \
               -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build ../build/win --target xbased
      - name: Host tests
        # as on Linux, with the translator's cputest
        run: |
          bash tools/native/host-tests.sh ../build/win | tee ../host-tests.txt || true
          ! grep '^FAIL' ../host-tests.txt | grep -v -x 'FAIL  hle/test_psh'

  macos:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # the SDK the port is built with (macOS 15.5), not the runner's default of the day
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: bash tools/fetch_deps.sh
      - name: Configure
        # for Intel Macs (x86-64) on the Apple silicon runner
        run: cmake -S native -B ../build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 \
               -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build ../build/macos --target xbased
      - name: Layout
        # what the kernel must map at exec time: a 64 KiB __PAGEZERO,
        # __XBGUEST from 0x10000 to __TEXT at 0x200000000 (cmake/macos.cmake,
        # tools/macos/reserve_guest.py); x86-64 alone, macOS 12 on, MoltenVK beside it
        run: |
          python3 - ../build/macos/xbased <<'EOF'
          import subprocess, sys
          exe = sys.argv[1]
          out = subprocess.run(["otool", "-l", exe], capture_output=True, text=True, check=True).stdout
          segs, name, minos = {}, None, None
          for line in out.splitlines():
              w = line.split()
              if len(w) == 2 and w[0] == "segname":
                  name = w[1]
              elif name and len(w) == 2 and w[0] in ("vmaddr", "vmsize"):
                  segs.setdefault(name, {}).setdefault(w[0], int(w[1], 16))
              elif len(w) == 2 and w[0] == "minos":
                  minos = w[1]
          want = {"__PAGEZERO": (0, 0x10000), "__XBGUEST": (0x10000, 0x200000000 - 0x10000),
                  "__TEXT": (0x200000000, None)}
          bad = 0
          for s, (addr, size) in want.items():
              got = segs.get(s, {})
              ok = got.get("vmaddr") == addr and (size is None or got.get("vmsize") == size)
              print(f"{s}: vmaddr {got.get('vmaddr', 0):#x} vmsize {got.get('vmsize', 0):#x}" + ("" if ok else "  WRONG"))
              bad += not ok
          archs = subprocess.run(["lipo", "-archs", exe], capture_output=True, text=True, check=True).stdout.split()
          print(f"archs {archs}, minos {minos}")
          bad += archs != ["x86_64"] or minos != "12.0"
          sys.exit(bad)
          EOF
          test -f ../build/macos/libMoltenVK.dylib
